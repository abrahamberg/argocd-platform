apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: checkout-dev
  namespace: argocd
  labels:
    team: checkout
    env: dev
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/abrahamberg/checkout-app.git
      path: chart
      targetRevision: v1.0.0          # a release of the chart
      helm:
        valueFiles:
          - $config/helm/dev.yaml
    - repoURL: https://github.com/abrahamberg/checkout-config.git
      targetRevision: main
      ref: config                     # makes $config point at this repo
  destination:
    server: https://kubernetes.default.svc
    namespace: checkout-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true