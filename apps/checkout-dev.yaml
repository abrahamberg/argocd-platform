apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: checkout-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting the app deletes what it deployed
spec:
  project: default
  source:
    repoURL: https://github.com/abrahamberg/checkout-config.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: checkout-dev
  syncPolicy:
    automated:
      prune: true       # delete what was deleted from Git
      selfHeal: true    # undo changes made outside Git
    syncOptions:
      - CreateNamespace=true
