# Reports each push to PlatformEngr, so your course work is verified step by step.
# GitHub signs which repo and commit this run is for; there is no secret to add.
name: PlatformEngr
on:
  push:
  workflow_dispatch:
permissions:
  id-token: write
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PLATFORMENGR_LEARNER: pe-tky484
    steps:
      - name: Report this push to PlatformEngr
        run: |
          ID=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://www.platformengr.com" | jq -r .value)
          curl -sS --fail-with-body --max-time 90 -X POST https://www.platformengr.com/api/repo/ping \
            -H "Authorization: Bearer $ID" -H "Content-Type: application/json" \
            -d "{\"learner\":\"$PLATFORMENGR_LEARNER\"}"
